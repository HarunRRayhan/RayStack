<!doctype html>
<html>
<head>
<style>
  :root { --c1: #0f172a; --c2: #1e3a8a; --c3: #0ea5b9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 45%, var(--c3) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #fff;
  }
  .title {
    position: absolute; top: 150px; left: 120px; right: 120px; height: 330px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-weight: 800; line-height: 1.28;
    font-size: clamp(40px, 4.4vw, 68px);
    overflow-wrap: anywhere;
  }
  .badges {
    position: absolute; top: 520px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px;
  }
  .badge {
    width: 80px; height: 80px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .footer {
    position: absolute; bottom: 40px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; font-weight: 600; opacity: 0.92;
  }
</style>
</head>
<body>
  <div class="title">{{TITLE}}</div>
  <div class="badges">{{BADGES}}</div>
  <div class="footer"><span>{{FOOTER_LEFT}}</span><span>{{FOOTER_RIGHT}}</span></div>
</body>
</html>
